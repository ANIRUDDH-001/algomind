name: Test Suite

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npx vitest run --reporter=github-actions

      - name: Run integration tests
        env:
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_SERVICE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_KEY }}
          REDIS_TEST_URL: ${{ secrets.REDIS_TEST_URL }}
          REDIS_TEST_TOKEN: ${{ secrets.REDIS_TEST_TOKEN }}
        run: npx vitest run src/__tests__/integration

      - name: Mutation Testing (high-risk modules)
        run: npx stryker run
        env:
          CI: true
        # Allow failure for now — build awareness before enforcing
        continue-on-error: false

      - name: Run Phase 6 observability contracts
        run: |
          npx vitest run src/lib/monitoring/__tests__/event-taxonomy.contract.test.ts
          npx vitest run src/__tests__/contracts/correlation-propagation.contract.test.ts
          npx vitest run src/app/api/admin/__tests__/health-aggregation.contract.test.ts
          npx vitest run src/app/owner/tabs/__tests__/analytics-schema.contract.test.tsx

      - name: Run observability simulation check
        run: npx tsx scripts/simulate-observability-check.ts

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: npx playwright test --project=chromium

      - name: Upload E2E report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
