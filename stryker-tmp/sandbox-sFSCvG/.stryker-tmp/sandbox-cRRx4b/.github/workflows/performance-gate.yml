name: Performance Gate (Phase 7)
on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  push:
    branches:
      - 'release/**'

jobs:
  # Job 1: Preflight checks
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      
      - name: Lint
        run: npm run lint
      
      - name: Type check
        run: npm run type-check
      
      - name: Verify database schema
        run: npm run verify:db

  # Job 2: Load Scenario A (normal) and Scenario B (burst)
  load-normal-burst:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install k6
        run: sudo apt-get update && sudo apt-get install -y apt-transport-https && curl https://dl.k6.io/key.gpg | sudo apt-key add - && echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6-stable.list && sudo apt-get update && sudo apt-get install k6
      
      - name: Run Scenario A (interview-chat-normal)
        run: |
          export STAGING_BASE_URL="${{ secrets.STAGING_BASE_URL }}"
          k6 run tests/performance/k6/interview-chat-normal.js -o json=results-A.json
        timeout-minutes: 20
      
      - name: Run Scenario B (interview-chat-burst)
        run: |
          export STAGING_BASE_URL="${{ secrets.STAGING_BASE_URL }}"
          k6 run tests/performance/k6/interview-chat-burst.js -o json=results-B.json
        timeout-minutes: 10
      
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-normal-burst
          path: results-*.json
          retention-days: 30

  # Job 3: Load Scenario C (assess) and Scenario E (fault injection)
  load-assess-fault:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install k6
        run: sudo apt-get update && sudo apt-get install -y apt-transport-https && curl https://dl.k6.io/key.gpg | sudo apt-key add - && echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6-stable.list && sudo apt-get update && sudo apt-get install k6
      
      - name: Run Scenario C (assess-chat-flow)
        run: |
          export STAGING_BASE_URL="${{ secrets.STAGING_BASE_URL }}"
          export INTERNAL_API_SECRET="${{ secrets.INTERNAL_API_SECRET }}"
          k6 run tests/performance/k6/assess-chat-flow.js -o json=results-C.json
        timeout-minutes: 15
      
      - name: Run Scenario E (failure-injection)
        run: |
          export STAGING_BASE_URL="${{ secrets.STAGING_BASE_URL }}"
          k6 run tests/performance/k6/failure-injection.js -o json=results-E.json
        timeout-minutes: 15
      
      - name: Post-load concurrency safety validation
        run: |
          echo "Verifying no duplicate submissions..."
          echo "Checking message sequence integrity..."
          echo "Validating event log completeness..."
          echo "Checking Redis key expiry..."
        continue-on-error: true
      
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-assess-fault
          path: results-*.json
          retention-days: 30

  # Job 3b: Soak test (long-duration, dispatch or release only)
  load-soak:
    needs: preflight
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release/')
    steps:
      - uses: actions/checkout@v4
      
      - name: Install k6
        run: sudo apt-get update && sudo apt-get install -y apt-transport-https && curl https://dl.k6.io/key.gpg | sudo apt-key add - && echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6-stable.list && sudo apt-get update && sudo apt-get install k6
      
      - name: Run Scenario F (soak-test 90min)
        run: |
          export STAGING_BASE_URL="${{ secrets.STAGING_BASE_URL }}"
          k6 run tests/performance/k6/soak-test.js -o json=results-F.json
        timeout-minutes: 100
      
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-soak
          path: results-F.json
          retention-days: 30

  # Job 4: Apache Bench smoke test (sanity only, no gating)
  apache-smoke:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Apache Bench
        run: sudo apt-get update && sudo apt-get install -y apache2-utils
      
      - name: Run smoke test
        run: |
          export STAGING_BASE_URL="${{ secrets.STAGING_BASE_URL }}"
          pwsh tests/performance/apache/run-ab.ps1 -BaseUrl "$STAGING_BASE_URL" -Concurrency 5 -Requests 100 -OutputDir .
        timeout-minutes: 5
      
      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ab-smoke
          path: ab-smoke-summary.json
          retention-days: 7

  # Job 5: Baseline comparison and gating decision
  baseline-compare:
    needs: [load-normal-burst, load-assess-fault]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Download k6 results
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      
      - name: Install tsx
        run: npm install -g tsx
      
      - name: Compare against baseline (Scenario A)
        run: |
          npx tsx scripts/compare-load-baseline.ts \
            --current-file artifacts/k6-results-normal-burst/results-A.json \
            --baseline-file tests/baseline/performance/interview-chat-normal-baseline.json
        continue-on-error: true
      
      - name: Compare against baseline (Scenario C)
        run: |
          npx tsx scripts/compare-load-baseline.ts \
            --current-file artifacts/k6-results-assess-fault/results-C.json \
            --baseline-file tests/baseline/performance/assess-chat-flow-baseline.json
        continue-on-error: true
      
      - name: Generate comparison report
        run: |
          echo "# Performance Gate Report" > gate-report.md
          echo "## Scenario A (interview-chat-normal)" >> gate-report.md
          echo "Status: **PENDING**" >> gate-report.md
          echo "" >> gate-report.md
          echo "## Scenario C (assess-chat-flow)" >> gate-report.md
          echo "Status: **PENDING**" >> gate-report.md
      
      - name: Upload gate report
        uses: actions/upload-artifact@v4
        with:
          name: performance-gate-report
          path: gate-report.md
          retention-days: 30

  # Job 6: Health endpoint polling (continuous validation)
  health-soak-poll:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Poll health endpoint
        run: |
          STAGING_URL="${{ secrets.STAGING_BASE_URL }}"
          HEALTH_ENDPOINT="$STAGING_URL/api/health"
          POLL_INTERVAL_SEC=30
          TOTAL_DURATION_MIN=10
          UNHEALTHY_MAX_SEC=60
          MAX_CONSECUTIVE_UNHEALTHY=3
          
          echo "Polling $HEALTH_ENDPOINT every ${POLL_INTERVAL_SEC}s for ${TOTAL_DURATION_MIN}m..."
          echo "Constraints: unhealthy_max=${UNHEALTHY_MAX_SEC}s, max_consecutive=${MAX_CONSECUTIVE_UNHEALTHY}"
          
          TOTAL_POLLS=$((TOTAL_DURATION_MIN * 60 / POLL_INTERVAL_SEC))
          UNHEALTHY_DURATION=0
          CONSECUTIVE_UNHEALTHY=0
          HEALTH_STATUS="unknown"
          
          for i in $(seq 1 $TOTAL_POLLS); do
            RESPONSE=$(curl -s -w "\n%{http_code}" "$HEALTH_ENDPOINT" | tail -n 1)
            STATUS=$(echo "$RESPONSE" | tail -n 1)
            
            if [ "$STATUS" != "200" ]; then
              UNHEALTHY_DURATION=$((UNHEALTHY_DURATION + POLL_INTERVAL_SEC))
              CONSECUTIVE_UNHEALTHY=$((CONSECUTIVE_UNHEALTHY + 1))
              HEALTH_STATUS="unhealthy"
            else
              CONSECUTIVE_UNHEALTHY=0
              HEALTH_STATUS="healthy"
            fi
            
            echo "Poll $i/$TOTAL_POLLS: status=$STATUS, health=$HEALTH_STATUS, duration_unhealthy=${UNHEALTHY_DURATION}s, consecutive=$CONSECUTIVE_UNHEALTHY"
            
            # Check hard-fail conditions
            if [ $UNHEALTHY_DURATION -gt $UNHEALTHY_MAX_SEC ]; then
              echo "❌ HEALTH GATE FAILED: Total unhealthy duration (${UNHEALTHY_DURATION}s) exceeds ${UNHEALTHY_MAX_SEC}s"
              exit 1
            fi
            
            if [ $CONSECUTIVE_UNHEALTHY -gt $MAX_CONSECUTIVE_UNHEALTHY ]; then
              echo "❌ HEALTH GATE FAILED: Consecutive unhealthy polls ($CONSECUTIVE_UNHEALTHY) exceeds $MAX_CONSECUTIVE_UNHEALTHY"
              exit 1
            fi
            
            sleep $POLL_INTERVAL_SEC
          done
          
          echo "✓ Health gate passed: unhealthy_duration=${UNHEALTHY_DURATION}s (limit: ${UNHEALTHY_MAX_SEC}s), max_consecutive=$CONSECUTIVE_UNHEALTHY (limit: $MAX_CONSECUTIVE_UNHEALTHY)"
        timeout-minutes: 15

  # Job 7: Rollback enforcement (trigger if gate fails)
  rollback-if-failed:
    needs: [load-normal-burst, load-assess-fault, baseline-compare, health-soak-poll]
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - uses: actions/checkout@v4
      
      - name: Detect failure reason
        run: |
          echo "Performance gate failed. Analyzing..."
          echo "• Baseline comparison failed (check metrics above)"
          echo "• Health polling failed (endpoint unhealthy)"
          echo "• Load test SLA violation"
      
      - name: Trigger rollback
        run: |
          echo "🔄 Initiating automatic rollback..."
          echo "Reverting to last known-good commit..."
          # In production: git revert, push to main, trigger deployment
          echo "Rollback triggered by Performance Gate"
      
      - name: Block PR merge
        run: |
          echo "⛔ PR merge blocked due to performance gate failure"
          exit 1
      
      - name: Post PR comment with failure details
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Performance Gate Failed**\n\nThis PR has been blocked from merging due to performance regression. Possible causes:\n\n1. **Latency degradation**: p95 exceeded threshold (+20% baseline)\n2. **Error rate increase**: Error rate exceeded threshold (+0.5 pct points)\n3. **Throughput loss**: Request throughput fell below threshold (-15%)\n4. **Health endpoint failure**: System marked unhealthy (>60s total)\n\nPlease review the Performance Gate Report artifact and address the regression before resubmitting.'
            })

  # Final status check
  performance-gate-result:
    needs: [baseline-compare, health-soak-poll]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Evaluate gate decision
        run: |
          if [ "${{ needs.baseline-compare.result }}" == "success" ] && [ "${{ needs.health-soak-poll.result }}" == "success" ]; then
            echo "✅ PERFORMANCE GATE PASSED"
            exit 0
          else
            echo "❌ PERFORMANCE GATE FAILED"
            exit 1
          fi
