<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333EA;stop-opacity:1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="512" height="512" rx="120" fill="url(#grad1)" />
  
  <!-- Circuit Brain Network -->
  <g transform="translate(106, 106) scale(0.6)" filter="url(#glow)">
    <circle cx="250" cy="250" r="180" stroke="white" stroke-width="20" fill="none" opacity="0.2" />
    <circle cx="250" cy="250" r="130" stroke="white" stroke-width="15" fill="none" opacity="0.3" />
    
    <!-- Nodes -->
    <circle cx="250" cy="120" r="25" fill="white" />
    <circle cx="120" cy="250" r="25" fill="white" />
    <circle cx="380" cy="250" r="25" fill="white" />
    <circle cx="250" cy="380" r="25" fill="white" />
    <circle cx="250" cy="250" r="40" fill="white" />
    
    <!-- Connections -->
    <path d="M250 145 L250 210" stroke="white" stroke-width="12" stroke-linecap="round" />
    <path d="M145 250 L210 250" stroke="white" stroke-width="12" stroke-linecap="round" />
    <path d="M355 250 L290 250" stroke="white" stroke-width="12" stroke-linecap="round" />
    <path d="M250 355 L250 290" stroke="white" stroke-width="12" stroke-linecap="round" />
    
    <!-- Diagonal Connections -->
    <path d="M165 165 L215 215" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.6" />
    <path d="M335 165 L285 215" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.6" />
    <path d="M165 335 L215 285" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.6" />
    <path d="M335 335 L285 285" stroke="white" stroke-width="8" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>
