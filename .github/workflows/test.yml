name: Test Suite

on: [push, pull_request]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npx vitest run --coverage
      - name: Check coverage thresholds
        run: npx vitest run --coverage --coverage.reporter=json-summary

  integration-tests:
    runs-on: ubuntu-latest
    services:
      supabase:
        image: supabase/postgres:15.1.1.28
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx supabase db reset --db-url "postgresql://postgres:postgres@127.0.0.1:5432/postgres"
      - run: npx vitest run src/__tests__/

  e2e-tests:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key
      TEST_USER_EMAIL: test@example.com
      TEST_USER_PASSWORD: password123
      CRON_SECRET: dummy-cron-secret
      PISTON_URL: http://dummy-piston
      GITHUB_TOKEN: dummy-token
      GITHUB_REPO: owner/repo
      GROQ_API_KEY: dummy-groq
      AWS_ACCESS_KEY_ID: dummy-aws-key
      AWS_SECRET_ACCESS_KEY: dummy-aws-secret
      AWS_S3_BUCKET: dummy-bucket
      AWS_REGION: ap-south-1
      UPSTASH_REDIS_REST_URL: https://dummy-redis
      UPSTASH_REDIS_REST_TOKEN: dummy-redis-token
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      SUPABASE_JWT_SECRET: dummy-jwt-secret
      SUPABASE_DIRECT_URL: postgres://dummy
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npx playwright install chromium
      - run: npx playwright test tests/e2e/
